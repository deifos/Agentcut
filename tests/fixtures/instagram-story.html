<!doctype html><html lang="en"><meta charset="utf-8"><meta name="agentcut-demo" content="synthetic"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; form-action 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>Instagram conversation · illustrative demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',sans-serif;color:#101b30;background:#f8faff;font-size:22px}button,textarea{font:inherit}button{cursor:pointer}header{height:90px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #e1e7ef}.logo{font-size:27px;font-weight:750;letter-spacing:-.8px}.mark{display:inline-grid;place-items:center;width:39px;height:39px;border-radius:12px;background:#101b30;color:white;margin-right:12px}.demo{font-size:17px;color:#56667e;border:1px solid #dce4ef;border-radius:24px;padding:9px 15px}.layout{display:grid;grid-template-columns:320px 1fr;height:810px}aside{padding:30px 20px;border-right:1px solid #e1e7ef;background:white}.eyebrow{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#73839a;font-weight:700;margin:0 12px 20px}.nav{border:0;background:transparent;text-align:left;width:100%;border-radius:12px;padding:16px;margin-bottom:9px;color:#526277}.nav.selected{background:#eef3ff;color:#245ecc;font-weight:700}.nav:hover{background:#edf3fc}.ig{display:inline-grid;place-items:center;color:#bd2782;font-weight:750;margin-right:12px}.thread{border:1px solid #dce5f3;background:#f4f7fd;text-align:left;width:100%;padding:22px 18px;border-radius:15px;margin-top:25px}.thread:hover{border-color:#80a6ed}.thread strong{display:block;font-size:22px}.thread span{display:block;font-size:17px;color:#64748b;margin-top:8px}.avatar{display:grid;place-items:center;width:48px;height:48px;flex-shrink:0;border-radius:50%;background:#e7effc;color:#2b5ea9;font-size:20px;font-weight:700}.chat{padding:24px 30px 20px;display:flex;flex-direction:column;min-height:0}.chathead{display:flex;align-items:center;justify-content:space-between;padding-bottom:21px;border-bottom:1px solid #dce4ef}.person{display:flex;align-items:center;gap:14px}.person strong{display:block}.person small{font-size:16px;color:#6a7b92}.badge{font-size:16px;color:#287c60;background:#e4f5ed;padding:8px 13px;border-radius:22px}.messages{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;padding:24px 2px;overflow:hidden;min-height:0}.msg{max-width:88%;animation:enter .3s ease-out}.msg small{display:block;font-size:16px;color:#6a7b92;margin:0 4px 7px}.bubble{padding:18px 22px;line-height:1.38;border:1px solid #dce4ef;border-radius:16px;background:white;font-size:24px}.assistant{align-self:flex-end}.assistant small{text-align:right}.assistant .bubble{background:#edf3fc;border-color:#dce7f7}.staff{align-self:flex-end}.staff small{text-align:right}.staff .bubble{background:#101b30;color:white;border:0}.typing{font-size:18px;color:#58729a;padding:5px}.typing i{display:inline-block;animation:pulse .8s infinite alternate;margin:0 3px;width:7px;height:7px;border-radius:50%;background:#7f96b6}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}.controls{border:1px solid #dce4ef;border-radius:15px;background:white;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}.controls label{font-size:16px;color:#6a7b92}.mode{display:flex;gap:6px;margin-top:6px}.mode span{border:1px solid #dce4ef;border-radius:8px;padding:7px 11px;font-size:16px}.mode .on{color:white;background:#101b30;border-color:#101b30}.claim{font-size:19px;border:1px solid #cbd7e9;background:white;color:#101b30;padding:12px 18px;border-radius:10px;font-weight:650}.claim:hover{background:#edf3fc;border-color:#618de0}.composer{margin-top:13px}.composer textarea{display:block;width:100%;height:84px;border:1px solid #ccd7e7;border-radius:12px;padding:14px 18px;resize:none;font-size:23px;outline:none;background:white}.composer textarea:focus{border-color:#2f74f0;box-shadow:0 0 0 3px #2f74f018}.composer textarea:disabled{background:#f1f5fa}.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:11px}.hint{font-size:16px;color:#708097}.send{padding:12px 22px;border-radius:10px;border:0;color:white;background:#101b30;font-size:20px;font-weight:650}.send:disabled{opacity:.3;cursor:default}.send:not(:disabled):hover{background:#294361}.empty{margin:auto;color:#64748b;text-align:center;line-height:1.7}.hidden{display:none!important}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{to{opacity:.25;transform:translateY(-3px)}}
</style>
<header><div class="logo"><span class="mark">•••</span>Chat with Website</div><span class="demo">Illustrative demo · fictional conversation</span></header>
<div class="layout"><aside><p class="eyebrow">Your inbox</p><button class="nav selected" id="website">▣ &nbsp; Website</button><button class="nav" id="instagram"><span class="ig">◎</span> Instagram <span style="float:right;font-size:17px">1</span></button><button class="thread hidden" id="thread"><strong>Alex Morgan <span style="display:inline;float:right;margin:0;color:#bd2782">◎</span></strong><span>Hi! Can you help me choose a session?</span></button><div style="position:absolute;bottom:34px;left:32px;font-size:16px;color:#7a8ba1">North Studio · demo business</div></aside>
<main class="chat"><div class="empty" id="empty"><span style="font-size:42px">◎</span><br>One assistant.<br>Website and Instagram.</div><div id="conversation" class="hidden" style="display:flex;flex-direction:column;min-height:0;height:100%"><div class="chathead"><div class="person"><div class="avatar">AM</div><div><strong>Alex Morgan</strong><small>Instagram · demo conversation</small></div></div><span class="badge" id="status">AI automatic</span></div><div class="messages" id="messages"></div><div class="controls"><div><label>Reply mode · this chat only</label><div class="mode"><span>Manual</span><span>AI drafts</span><span class="on">AI automatic</span></div></div><button class="claim" id="claim">✋ &nbsp; Assign to me</button></div><div class="composer"><textarea id="reply" data-demo-input aria-label="Your reply" placeholder="Assign this chat to yourself to reply" disabled></textarea><div class="bottom"><span class="hint" id="hint">AI replies to future incoming messages.</span><button class="send" id="send" data-demo-action disabled>Send reply ↗</button></div></div></div></main></div>
<script>
let opened=false;const $=s=>document.querySelector(s);function message(role,author,text){const d=document.createElement('div');d.className='msg '+role;const small=document.createElement('small');small.textContent=author+' · 10:24';const p=document.createElement('div');p.className='bubble';p.textContent=text;d.append(small,p);$('#messages').append(d);}
$('#instagram').onclick=()=>{$('#website').classList.remove('selected');$('#instagram').classList.add('selected');$('#thread').classList.remove('hidden');};
$('#thread').onclick=()=>{if(opened)return;opened=true;$('#empty').classList.add('hidden');$('#conversation').classList.remove('hidden');message('customer','Alex Morgan','Hi! Can you help me choose a session?');setTimeout(()=>{const t=document.createElement('div');t.id='typing';t.className='typing';t.innerHTML='<i></i><i></i><i></i> &nbsp; Assistant is typing';$('#messages').append(t);},600);setTimeout(()=>{$('#typing')?.remove();message('assistant','Website assistant','Of course. What kind of session do you have in mind?');},2100);setTimeout(()=>message('customer','Alex Morgan','A portrait session. Could I speak with someone?'),6200);};
$('#claim').onclick=()=>{$('#status').textContent="You’re handling this chat";$('#status').style.background='#eaf1fe';$('#status').style.color='#245ecc';$('#hint').textContent='AI is paused while you handle this chat.';$('#reply').disabled=false;$('#reply').placeholder='Write your reply…';$('#claim').textContent='✓ Assigned to you';$('#claim').disabled=true;};
$('#reply').oninput=()=>$('#send').disabled=!$('#reply').value.trim();$('#send').onclick=()=>{if(!$('#reply').value.trim())return;message('staff','You',$('#reply').value.trim());$('#reply').value='';$('#send').disabled=true;$('#hint').textContent='Demo reply added locally. No message was sent to Instagram.';};
</script></html>
